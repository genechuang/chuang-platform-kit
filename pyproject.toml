[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chuang-platform-kit"
version = "0.10.0"
description = "Gene Chuang's project-agnostic platform kit: secret redaction, structured Cloud Logging, a WhatsApp transport over GREEN-API and Pub/Sub, a Gmail sender, phone normalization, a per-request scope and a lazy importer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Gene Chuang" }]
dependencies = [
  "requests>=2.31",
  # clock.zone() is zoneinfo, which reads the OS zone database; Windows has
  # none, so a Windows host (the SMAD desktop) needs the PyPI copy.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The Gmail sender pulls Google libraries the host project usually already has;
# declare them here so a bare install of just the kit can run every module.
# `gcp` is empty since 0.6.0: Pub/Sub is published over REST (pubsub.py), and a
# host that still names the extra keeps installing.
gcp = []
gmail = ["google-api-python-client>=2.100", "google-auth>=2.23", "google-auth-oauthlib>=1.1"]
dev = ["pytest>=8", "pytest-xdist>=3", "pyflakes>=3"]
# Errors and traces to Sentry (monitoring.py); without it monitoring.init() is a no-op.
monitoring = ["sentry-sdk>=2.20,<3"]
# The OpenFeature provider over a Config (config.provider()); Config itself needs nothing.
config = ["openfeature-sdk>=0.7,<1"]
# Postgres (db.py): psycopg 3 with the bundled libpq. SQLAlchemy, for db.engine(), is the host's own pin.
db = ["psycopg[binary]>=3.1"]

[project.scripts]
# git's pre-push gate (push_gate.py); `python -m chuang_platform_kit.push_gate` is the same.
chuang-push-gate = "chuang_platform_kit.push_gate:main"

[project.urls]
Homepage = "https://github.com/genechuang/chuang-platform-kit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites are hand-rolled scripts (tests/test-*.py, one PASS/FAIL line per
# check, a final "N failure(s)" line); tests/conftest.py runs each as one item.
python_files = "__no_native_suites__.py"
addopts = "-q"
