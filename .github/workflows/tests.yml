name: Tests

# Every suite under tests/ on every push and pull request, through pytest's
# shim in tests/conftest.py (one item per hand-rolled suite). A tag is cut only
# from a green main: the host projects pin the kit by tag.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the kit with every extra
        run: pip install -q -e ".[gcp,gmail,dev]"

      - name: Lint
        run: python -m pyflakes src tests

      - name: Run the suites
        run: python -m pytest -n auto
