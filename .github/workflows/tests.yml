name: Tests

# Every suite under tests/ on every push and pull request, through pytest's
# shim in tests/conftest.py (one item per hand-rolled suite). A tag is cut only
# from a green main: the host projects pin the kit by tag.

on:
  # Branches only (SMADPickleBot #665): a bare `push:` also fired for the release tag pushed on the same commit, two
  # runs per release. A tag is cut from a green main, so it needs no run of its own.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the kit with every extra
        run: pip install -q -e ".[gcp,gmail,dev,monitoring,asc,clerk]"

      # chuang-sdlc, the second distribution (sdlc/), installed from its own pyproject so its packaging is proven too.
      - name: Install chuang-sdlc
        run: pip install -q -e ./sdlc

      - name: Lint
        run: python -m pyflakes src sdlc/src tests

      - name: Run the suites
        run: python -m pytest -n auto
