[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# chuang-sdlc: the ticket tools, a distribution of its own beside chuang-platform-kit in the same repository, so a
# release of it reaches only the hosts' code that runs it (a host pins it there alone), never every service the main
# package's pin is in. Installed from its tag with the subdirectory:
#   chuang-sdlc @ git+https://github.com/genechuang/chuang-platform-kit@sdlc-v<version>#subdirectory=sdlc
[project]
name = "chuang-sdlc"
version = "0.11.0"
description = "A project's tickets on a GitHub Project board: fields and moves along its flow, filing with one estimate stage, the triage sweep, the shipped stage and change orders, the ship card, the level of effort estimated and actual, the commit trailers its pipelines read and its post-ship steps run, one pull request a ship, a ship's release notes in its tickets' own words, the scrum master's sweep, the backlog by state, alert issues filed once per opening, the board's event listeners and what a webhook delivery means, and a triage pass on a box."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Gene Chuang" }]
# The main package by range, never a pin: the host's own pin of chuang-platform-kit is the one installed.
dependencies = ["chuang-platform-kit>=0.27.0"]   # 0.27.0: google_rest.get_execution (post_ship.execution_result)

[project.urls]
Homepage = "https://github.com/genechuang/chuang-platform-kit"

[tool.setuptools.packages.find]
where = ["src"]
